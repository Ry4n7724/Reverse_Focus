<section class="todo">
    <header class="todo-header">
        <h2>Tasks</h2>
        @if (tasks().length) {
        <span class="counter">{{ doneCount() }}/{{ tasks().length }} done</span>
        }
        @if (doneCount() > 0) {
        <button tuiButton type="button" appearance="flat" size="xs" (click)="clearCompleted()">
            Clear completed
        </button>
        }
    </header>

    <div class="add-row">
        <tui-textfield class="add-field">
            <label tuiLabel>Add a task</label>
            <input tuiTextfield maxlength="80" [formControl]="newTask" (keydown.enter)="addTask()" />
        </tui-textfield>
        <button tuiIconButton type="button" size="l" iconStart="@tui.plus" aria-label="Add task"
            [disabled]="!newTask.value.trim()" (click)="addTask()">
            Add
        </button>
    </div>

    <ul class="task-list">
        @for (task of tasks(); track task.id) {
        <li class="task" [class.done]="task.done">
            <label class="task-label">
                <input tuiCheckbox type="checkbox" size="m" [checked]="task.done"
                    (change)="toggleTaskDone(task)" />
                <span class="task-text">{{ task.task }}</span>
            </label>
            <button tuiIconButton type="button" appearance="flat" size="xs" iconStart="@tui.trash"
                class="delete" aria-label="Delete task" (click)="deleteTask(task.id)">
                Delete
            </button>
        </li>
        } @empty {
        <li class="empty">Nothing to do yet. Add your first task above.</li>
        }
    </ul>
</section>
