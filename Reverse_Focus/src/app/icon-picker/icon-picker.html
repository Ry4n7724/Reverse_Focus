<button tuiIconButton type="button" appearance="secondary" size="l" aria-label="Choose icon"
    [tuiDropdown]="dropdownContent" [tuiDropdownOpen]="open()" (tuiDropdownOpenChange)="open.set($event)">
    <lucide-icon [name]="iconValue() || 'book'" class="current-icon"></lucide-icon>
    Choose icon
</button>

<ng-template #dropdownContent>
    <div class="picker">
        <tui-textfield>
            <label tuiLabel>Search icons</label>
            <input tuiTextfield autocomplete="off" [ngModel]="query()" (ngModelChange)="query.set($event)" />
        </tui-textfield>
        <div class="icon-grid">
            @for (name of results().shown; track name) {
            <button type="button" class="icon-option" [class.selected]="name === iconValue()" [attr.aria-label]="name"
                [title]="name" (click)="selectIcon(name)">
                <lucide-icon [name]="name"></lucide-icon>
            </button>
            } @empty {
            <p class="hint">No icons match "{{ query() }}"</p>
            }
        </div>
        @if (results().total > results().shown.length) {
        <p class="hint">Showing {{ results().shown.length }} of {{ results().total }}. Type to narrow down.</p>
        }
    </div>
</ng-template>
